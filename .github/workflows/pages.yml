name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check current-site translations and offer copy
        run: |
          python3 scripts/audit-localization.py
          node scripts/test-offer-copy.cjs

      - name: Check product logic and downloadable package
        run: |
          node scripts/test-brief.cjs
          node scripts/test-catalog.cjs
          python3 -B scripts/test_brief_package.py
          python3 scripts/check_brief_package.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
